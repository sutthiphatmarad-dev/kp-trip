<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แผนเที่ยวของคุณ - KP Smart Travel</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Noto+Serif+Thai:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--moss:#1f4d3a;--gold:#c8962b;--sage:#eef3ee;--ink:#17231d;--stone:#66776c;--line:#d5e0d8;--red:#b3322b;}
body{font-family:'IBM Plex Sans Thai',sans-serif;background:var(--sage);color:var(--ink);}
.serif{font-family:'Noto Serif Thai',serif;}
.top{background:var(--moss);color:#fff;padding:22px 0;}
.top a{color:#cfe3d6;text-decoration:none;font-size:.9rem;}
.sum{display:flex;gap:28px;flex-wrap:wrap;margin-top:10px;}
.sum div small{display:block;color:#cfe3d6;font-size:.8rem;}
.sum div b{font-size:1.35rem;font-family:'Noto Serif Thai',serif;}
.sum .over{color:#ffb4ae;}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:14px 0;}
.tabs button{border:1.5px solid var(--moss);background:#fff;color:var(--moss);border-radius:999px;padding:6px 18px;white-space:nowrap;font-weight:500;}
.tabs button.on{background:var(--moss);color:#fff;}
#map{height:38vh;min-height:300px;border-radius:14px;border:1px solid var(--line);}
@media(min-width:992px){.mapcol{position:sticky;top:12px;} #map{height:calc(100vh - 150px);}}
.route-info{font-size:.88rem;color:var(--stone);margin:8px 2px;min-height:1.3em;}
.day-head{display:flex;justify-content:space-between;align-items:baseline;margin:20px 0 8px;}
.day-head h3{font-size:1.1rem;margin:0;color:var(--moss);}
.day-head span{font-size:.85rem;color:var(--stone);}
.stop{display:grid;grid-template-columns:62px 40px 1fr;gap:10px 12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;}
.stop .t{font-weight:600;color:var(--moss);outline:none;}
.stop .drv{font-size:.74rem;color:var(--stone);}
.stop img{width:40px;height:40px;}
.nm{font-weight:600;cursor:pointer;}
.nm:hover{text-decoration:underline;}
.cat{font-size:.78rem;background:var(--sage);border-radius:999px;padding:2px 10px;color:var(--stone);}
.nav{font-size:.82rem;color:var(--moss);margin-left:8px;}
.costs{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:8px;align-items:end;border-top:1px dashed var(--line);padding-top:10px;}
.costs label{font-size:.72rem;color:var(--stone);display:block;}
.costs input{width:84px;border:1.5px solid var(--line);border-radius:8px;padding:4px 8px;font:inherit;font-size:.9rem;}
.costs input:focus{outline:none;border-color:var(--moss);}
.rem{margin-left:auto;text-align:right;font-weight:600;color:var(--moss);}
.rem small{display:block;font-weight:400;color:var(--stone);font-size:.72rem;}
.rem.neg{color:var(--red);}
.ctl button{border:1px solid var(--line);background:#fff;border-radius:8px;width:32px;height:32px;margin-left:4px;}
.ctl button:hover{background:var(--sage);}
.ctl .x:hover{background:#fbe6e4;color:var(--red);}
.btn-moss{background:var(--moss);color:#fff;border:0;border-radius:10px;padding:8px 16px;}
.btn-moss:hover{background:#153629;color:#fff;}
.btn-gold{background:var(--gold);color:#fff;border:0;border-radius:10px;padding:8px 16px;}
.btn-gold:hover{background:#b0831f;color:#fff;}
.banner{display:none;background:#fff4d6;border:1px solid var(--gold);border-radius:10px;padding:8px 12px;margin-bottom:8px;font-size:.9rem;}
#chatBtn{position:fixed;right:22px;bottom:22px;width:58px;height:58px;border-radius:50%;border:0;background:var(--moss);color:#fff;font-size:1.5rem;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:1000;}
#chatBox{display:none;position:fixed;right:22px;bottom:92px;width:340px;max-width:92vw;height:440px;background:#fff;border:1.5px solid var(--moss);border-radius:14px;z-index:1000;flex-direction:column;overflow:hidden;}
#chatBox header{background:var(--moss);color:#fff;padding:10px 14px;display:flex;justify-content:space-between;}
#chatHistory{flex:1;overflow-y:auto;padding:10px;background:var(--sage);display:flex;flex-direction:column;gap:8px;}
.msg{max-width:84%;padding:8px 12px;border-radius:12px;font-size:.9rem;white-space:pre-wrap;}
.msg.bot{background:#fff;border:1px solid var(--line);align-self:flex-start;}
.msg.me{background:var(--moss);color:#fff;align-self:flex-end;}
#chatBox form{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line);}
#chatBox input{flex:1;border:1.5px solid var(--line);border-radius:8px;padding:6px 10px;font:inherit;}
</style>
</head>
<body>
<header class="top"><div class="container-xl">
  <a href="/">← วางแผนใหม่</a>
  <h1 class="serif fs-3 mb-0 mt-1">แผนเที่ยวกำแพงเพชรของคุณ</h1>
  <div class="sum">
    <div><small>งบรวมทริป</small><b id="sTotal">-</b></div>
    <div><small>ใช้ไปแล้ว</small><b id="sSpent">-</b></div>
    <div><small>คงเหลือ</small><b id="sLeft">-</b></div>
  </div>
</div></header>

<main class="container-xl pb-5">
  {% if notice %}<div class="alert alert-warning mt-3 mb-0">{{ notice }}</div>{% endif %}
  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="row g-3">
    <div class="col-lg-7 order-lg-2 mapcol-wrap"><div class="mapcol">
      <div id="map" role="application" aria-label="แผนที่เส้นทาง"></div>
      <div class="route-info" id="routeInfo"></div>
      <div class="d-flex gap-2 flex-wrap">
        <button class="btn-gold" id="optBtn" onclick="optimizeDay()" style="display:none">จัดเส้นทางให้สั้นที่สุด</button>
        <button class="btn-moss" onclick="startAdd()">+ เพิ่มจุดแวะ</button>
      </div>
    </div></div>
    <div class="col-lg-5 order-lg-1">
      <div class="banner" id="banner">แตะบนแผนที่เพื่อวางจุดแวะใหม่ <a href="#" onclick="cancelAdd();return false">ยกเลิก</a></div>
      <div id="plan"></div>
      <p class="text-secondary small mt-3">ค่าน้ำมันประเมินจากระยะทางระหว่างจุดและอัตราสิ้นเปลืองที่คุณระบุ แก้ตัวเลขได้ทุกช่อง</p>
    </div>
  </div>
</main>

<button id="chatBtn" aria-label="ถามน้องไกด์">💬</button>
<div id="chatBox">
  <header><b>น้องไกด์</b><button type="button" id="chatClose" class="btn btn-sm text-white p-0" aria-label="ปิด">✕</button></header>
  <div id="chatHistory"><div class="msg bot">สวัสดีครับ อยากรู้อะไรเกี่ยวกับทริปกำแพงเพชร ถามได้เลย</div></div>
  <form id="chatForm"><input id="chatInput" placeholder="พิมพ์คำถาม..." autocomplete="off"><button class="btn-moss">ส่ง</button></form>
</div>

<script>
const PLAN = {{ plan|tojson }};
const NUM_DAYS = {{ num_days }};
const DAILY = {{ daily_budget }};
const ICONS = {
  TEMPLE:'https://img.icons8.com/color/96/pagoda.png', HISTORY:'https://img.icons8.com/color/96/museum.png',
  NATURE:'https://img.icons8.com/color/96/national-park.png', FOOD:'https://img.icons8.com/color/96/restaurant.png',
  CAFE:'https://img.icons8.com/color/96/cafe.png', MARKET:'https://img.icons8.com/color/96/shopping-cart.png',
  HOTEL:'https://img.icons8.com/color/96/bed.png', OTHER:'https://img.icons8.com/color/96/map-pin.png'
};
const DAY_COLORS = ['#1f4d3a','#c8962b','#2b6cb3','#a23b72'];
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const baht = n => Math.round(n).toLocaleString('th-TH') + ' ฿';

let filter = 'all', gmap, dirSvc, dirRender, markers = [], lines = [], adding = false;

/* ---------- วาดรายการ ---------- */
function stopHTML(s) {
  return `
    <div><div class="t" contenteditable="true" spellcheck="false">${esc(s.time)}</div><div class="drv">${s.travel ? '🚗 ' + esc(s.travel) : ''}</div></div>
    <img src="${ICONS[s.icon] || ICONS.OTHER}" alt="">
    <div>
      <div class="nm" onclick="focusStop(this)">${esc(s.name)}</div>
      <span class="cat">${esc(s.cat)}</span><a class="nav" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lng}">นำทาง</a>
    </div>
    <div class="costs">
      <div><label>ค่าเข้า/อาหาร</label><input type="number" min="0" class="price" value="${s.price}" oninput="recalc()"></div>
      <div><label>ค่าน้ำมัน</label><input type="number" min="0" class="fuel" value="${s.fuel}" oninput="recalc()"></div>
      <div class="ctl"><button type="button" onclick="move(this,-1)" aria-label="เลื่อนขึ้น">↑</button><button type="button" onclick="move(this,1)" aria-label="เลื่อนลง">↓</button><button type="button" class="x" onclick="del(this)" aria-label="ลบ">✕</button></div>
      <div class="rem"><small>คงเหลือวันนี้</small><span class="remv">-</span></div>
    </div>`;
}
function makeStop(s) {
  const el = document.createElement('article');
  el.className = 'stop'; el.dataset.lat = s.lat; el.dataset.lng = s.lng; el.dataset.name = s.name; el.dataset.icon = s.icon;
  el.innerHTML = stopHTML(s);
  return el;
}
function render() {
  const days = [...new Set(PLAN.map(s => s.day))].sort((a, b) => a - b);
  $('plan').innerHTML = '';
  days.forEach(d => {
    const sec = document.createElement('section');
    sec.className = 'day'; sec.dataset.day = d;
    sec.innerHTML = `<div class="day-head"><h3 class="serif">วันที่ ${d}</h3><span class="dsum"></span></div><div class="stops"></div>`;
    PLAN.filter(s => s.day === d).forEach(s => sec.querySelector('.stops').appendChild(makeStop(s)));
    $('plan').appendChild(sec);
  });
  if (days.length > 1) {
    $('tabs').innerHTML = `<button class="on" onclick="setFilter('all',this)">ทั้งหมด</button>` +
      days.map(d => `<button onclick="setFilter('${d}',this)">วันที่ ${d}</button>`).join('');
  } else { $('tabs').style.display = 'none'; filter = String(days[0] || 1); }
  recalc();
}
function setFilter(f, btn) {
  filter = f;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.remove('on')); btn.classList.add('on');
  document.querySelectorAll('.day').forEach(s => s.style.display = (f === 'all' || s.dataset.day === f) ? '' : 'none');
  draw();
}

/* ---------- งบประมาณ ---------- */
function recalc() {
  let total = 0, spent = 0;
  document.querySelectorAll('.day').forEach(sec => {
    let left = DAILY, used = 0;
    sec.querySelectorAll('.stop').forEach(st => {
      const c = (parseFloat(st.querySelector('.price').value) || 0) + (parseFloat(st.querySelector('.fuel').value) || 0);
      used += c; left -= c;
      const r = st.querySelector('.rem'); r.querySelector('.remv').textContent = baht(left); r.classList.toggle('neg', left < 0);
    });
    sec.querySelector('.dsum').textContent = `ใช้ ${baht(used)} จาก ${baht(DAILY)}`;
    total += DAILY; spent += used;
  });
  $('sTotal').textContent = baht(total); $('sSpent').textContent = baht(spent);
  $('sLeft').textContent = baht(total - spent); $('sLeft').classList.toggle('over', total - spent < 0);
}

/* ---------- จัดลำดับ ---------- */
function move(btn, dir) {
  const row = btn.closest('.stop'), sib = dir < 0 ? row.previousElementSibling : row.nextElementSibling;
  if (!sib) return;
  dir < 0 ? row.parentNode.insertBefore(row, sib) : row.parentNode.insertBefore(sib, row);
  recalc(); draw();
}
function del(btn) {
  if (!confirm('ลบจุดนี้ออกจากทริป?')) return;
  btn.closest('.stop').remove(); recalc(); draw();
}

/* ---------- แผนที่ ---------- */
function visibleSections() { return [...document.querySelectorAll('.day')].filter(s => s.style.display !== 'none'); }
function clearMap() {
  markers.forEach(m => m.setMap(null)); markers = [];
  lines.forEach(l => l.setMap(null)); lines = [];
  dirRender.setDirections({ routes: [] });
}
function pos(st) { return { lat: parseFloat(st.dataset.lat), lng: parseFloat(st.dataset.lng) }; }

function draw() {
  if (!gmap) return;
  clearMap();
  $('routeInfo').textContent = '';
  const secs = visibleSections(), bounds = new google.maps.LatLngBounds();
  const single = secs.length === 1;
  $('optBtn').style.display = single ? '' : 'none';

  secs.forEach(sec => {
    const d = parseInt(sec.dataset.day, 10), color = DAY_COLORS[(d - 1) % DAY_COLORS.length];
    const stops = [...sec.querySelectorAll('.stop')], path = [];
    stops.forEach((st, i) => {
      const p = pos(st); if (isNaN(p.lat) || isNaN(p.lng)) return;
      path.push(p); bounds.extend(p);
      const m = new google.maps.Marker({
        position: p, map: gmap, title: st.dataset.name,
        label: { text: String(i + 1), color: '#fff', fontWeight: '600' },
        icon: { path: google.maps.SymbolPath.CIRCLE, scale: 14, fillColor: color, fillOpacity: 1, strokeColor: '#fff', strokeWeight: 2 }
      });
      const iw = new google.maps.InfoWindow({ content: `<b>${esc(st.dataset.name)}</b>` });
      m.addListener('click', () => iw.open(gmap, m));
      st._marker = m; markers.push(m);
    });
    if (!single && path.length > 1) {
      lines.push(new google.maps.Polyline({ path, map: gmap, strokeColor: color, strokeOpacity: .85, strokeWeight: 4 }));
    }
  });
  if (!bounds.isEmpty()) gmap.fitBounds(bounds, 40);
  if (single) route(secs[0], false);
}

function route(sec, optimize, cb) {
  const stops = [...sec.querySelectorAll('.stop')];
  if (stops.length < 2) return;
  const wp = stops.slice(1, -1).slice(0, 23).map(s => ({ location: pos(s), stopover: true }));
  dirSvc.route({
    origin: pos(stops[0]), destination: pos(stops[stops.length - 1]), waypoints: wp,
    optimizeWaypoints: optimize, travelMode: google.maps.TravelMode.DRIVING
  }, (res, status) => {
    if (status === 'OK') {
      dirRender.setDirections(res);
      let m = 0, s = 0; res.routes[0].legs.forEach(l => { m += l.distance.value; s += l.duration.value; });
      $('routeInfo').textContent = `ระยะทางรวม ประมาณ ${(m / 1000).toFixed(1)} กม. ขับรถรวม ประมาณ ${Math.round(s / 60)} นาที`;
      if (cb) cb(res.routes[0].waypoint_order, stops);
    } else {
      $('routeInfo').textContent = 'คำนวณเส้นทางถนนไม่ได้ (' + status + ') แสดงเฉพาะหมุดบนแผนที่';
      lines.push(new google.maps.Polyline({ path: stops.map(pos), map: gmap, strokeColor: '#c8962b', strokeWeight: 3, strokeOpacity: .8 }));
    }
  });
}
function optimizeDay() {
  const sec = visibleSections()[0]; if (!sec) return;
  $('routeInfo').textContent = 'กำลังคำนวณ...';
  route(sec, true, (order, stops) => {
    const mid = stops.slice(1, -1), last = stops[stops.length - 1];
    order.forEach(i => last.parentNode.insertBefore(mid[i], last));
    recalc(); draw();
  });
}
function focusStop(el) {
  const st = el.closest('.stop'), p = pos(st);
  if (gmap) { gmap.panTo(p); gmap.setZoom(15); if (st._marker) google.maps.event.trigger(st._marker, 'click'); window.scrollTo({ top: 0, behavior: 'smooth' }); }
}

/* ---------- เพิ่มจุดแวะเอง ---------- */
function startAdd() { if (!gmap) return; adding = true; $('banner').style.display = 'block'; gmap.setOptions({ draggableCursor: 'crosshair' }); }
function cancelAdd() { adding = false; $('banner').style.display = 'none'; gmap && gmap.setOptions({ draggableCursor: '' }); }

function initMap() {
  gmap = new google.maps.Map($('map'), { zoom: 11, center: { lat: 16.4828, lng: 99.5227 }, gestureHandling: 'greedy', streetViewControl: false });
  dirSvc = new google.maps.DirectionsService();
  dirRender = new google.maps.DirectionsRenderer({ map: gmap, suppressMarkers: true, preserveViewport: true,
    polylineOptions: { strokeColor: '#1f4d3a', strokeWeight: 6, strokeOpacity: .8 } });
  gmap.addListener('click', e => {
    if (!adding) return;
    const name = prompt('ชื่อจุดแวะนี้คืออะไร?'); if (!name) return cancelAdd();
    const secs = [...document.querySelectorAll('.day')];
    const sec = (filter !== 'all' && secs.find(s => s.dataset.day === filter)) || secs[secs.length - 1];
    sec.querySelector('.stops').appendChild(makeStop({ time: '12:00', travel: '', icon: 'OTHER', name, cat: 'เพิ่มเอง',
      lat: +e.latLng.lat().toFixed(6), lng: +e.latLng.lng().toFixed(6), price: 0, fuel: 0 }));
    cancelAdd(); recalc(); draw();
  });
  // ถ้ามีวันเดียว draw() จะวาดเส้นทางทันที
  draw();
}
window.initMap = initMap;
render();

/* ---------- แชทน้องไกด์ ---------- */
const box = $('chatBox'), hist = $('chatHistory');
$('chatBtn').onclick = () => { box.style.display = box.style.display === 'flex' ? 'none' : 'flex'; };
$('chatClose').onclick = () => { box.style.display = 'none'; };
function addMsg(t, who) { const d = document.createElement('div'); d.className = 'msg ' + who; d.textContent = t; hist.appendChild(d); hist.scrollTop = hist.scrollHeight; return d; }
$('chatForm').addEventListener('submit', async e => {
  e.preventDefault();
  const q = $('chatInput').value.trim(); if (!q) return;
  addMsg(q, 'me'); $('chatInput').value = '';
  const wait = addMsg('กำลังพิมพ์...', 'bot');
  try {
    const r = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: q }) });
    wait.textContent = (await r.json()).response;
  } catch (err) { wait.textContent = 'ส่งข้อความไม่สำเร็จ ลองใหม่อีกครั้งนะครับ'; }
});
</script>
<script async defer src="https://maps.googleapis.com/maps/api/js?key={{ maps_key }}&callback=initMap"></script>
</body>
</html>
